name: reyy_cinema
description: "Reyy Cinema technical test app LOGKAR."
publish_to: "none"
version: 1.0.0
environment:
  sdk: ^3.10.8

dependencies:
  cached_network_image: ^3.4.1
  carousel_slider: 5.1.2
  device_preview: ^1.2.0
  dio: ^5.9.2
  event_bus: ^2.0.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_form_builder: ^10.3.0+2
  flutter_gen: ^5.13.0+1
  flutter_html: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_map: ^8.3.2
  flutter_native_splash: ^2.4.7
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.3.0
  form_builder_validators: ^11.3.0
  geolocator: ^14.0.2
  go_router: ^17.1.0
  image_picker: ^1.2.1
  latlong2: ^0.10.1
  loading_animation_widget: ^1.3.0
  modal_bottom_sheet: 3.0.0
  package_info_plus: ^8.3.0
  shared_preferences: ^2.5.4
  shimmer: ^3.0.0

dev_dependencies:
  build_runner: ^2.13.0
  change_app_package_name: ^1.5.0
  flutter_gen_runner: ^5.13.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/2.0x/
    - assets/images/3.0x/

    - assets/icons/
    - assets/icons/2.0x/
    - assets/icons/3.0x/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/PlusJakartaSans-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/PlusJakartaSans-Light.ttf
          weight: 300
        - asset: assets/fonts/PlusJakartaSans-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/PlusJakartaSans-ExtraBoldItalic.ttf
          weight: 800
          style: italic

flutter_gen:
  output: lib/gen/
  line_length: 80
  integrations:
    flutter_svg: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/ic_logo_app.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/ic_logo_app.png"

flutter_native_splash:
  color: "#000000"
  image: assets/images/img_logo_splash.png
  android: true
  ios: true
  android_12:
    color: "#000000"
    image: assets/images/img_logo_splash.png
